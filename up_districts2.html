<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoya - Uttar Pradesh Districts (3D)</title>
<style>
  :root {
    --bg-dark: #050811;
    --panel-bg: rgba(10, 16, 30, 0.85);
    --border-glow: rgba(79, 216, 255, 0.3);
    --cyan: #4fd8ff;
    --amber: #ffcc66;
    --muted: #8fa3b8;
    --text: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
  #canvasWrap { position: absolute; inset: 0; }

  .top-title { position: absolute; top: 18px; left: 20px; z-index: 10; }
  .top-title h1 { font-size: 18px; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  .top-title p { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 460px; }

  .back-btn {
    position: absolute; top: 18px; right: 20px; z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--border-glow);
    color: var(--cyan); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; cursor: pointer; letter-spacing: 1px;
  }
  .back-btn:hover { background: rgba(79,216,255,0.15); }

  .hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-bg); border: 1px solid var(--border-glow);
    padding: 8px 18px; border-radius: 20px; font-size: 12px; color: var(--cyan);
    z-index: 10; backdrop-filter: blur(8px);
  }

  .toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(255,204,102,0.15); border: 1px solid var(--amber);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; color: var(--amber);
    z-index: 10; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-title">
  <h1>UTTAR PRADESH — 75 DISTRICTS (STYLIZED)</h1>
  <p>Grid layout illustrative hai, exact geography nahi. Abhi sirf Hamirpur active hai (flood simulation demo).</p>
</div>
<button class="back-btn" onclick="location.href='india_map.html'">← INDIA MAP</button>

<div id="canvasWrap"></div>
<div class="toast" id="toast"></div>
<div class="hint">Mouse se ghumao • Highlighted block (Hamirpur) par click karo</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =========================================================
// All 75 districts of Uttar Pradesh, arranged in a simple
// alphabetical grid (NOT geographically accurate positions).
// Only Hamirpur is active for now.
// =========================================================

const DISTRICTS = [
  "Agra","Aligarh","Ambedkar Nagar","Amethi","Amroha","Auraiya","Ayodhya","Azamgarh",
  "Baghpat","Bahraich","Ballia","Balrampur","Banda","Barabanki","Bareilly","Basti",
  "Bhadohi","Bijnor","Budaun","Bulandshahr","Chandauli","Chitrakoot","Deoria","Etah",
  "Etawah","Farrukhabad","Fatehpur","Firozabad","Gautam Buddha Nagar","Ghaziabad",
  "Ghazipur","Gonda","Gorakhpur","Hamirpur","Hapur","Hardoi","Hathras","Jalaun",
  "Jaunpur","Jhansi","Kannauj","Kanpur Dehat","Kanpur Nagar","Kasganj","Kaushambi",
  "Kheri","Kushinagar","Lalitpur","Lucknow","Maharajganj","Mahoba","Mainpuri",
  "Mathura","Mau","Meerut","Mirzapur","Moradabad","Muzaffarnagar","Pilibhit",
  "Pratapgarh","Prayagraj","Raebareli","Rampur","Saharanpur","Sambhal",
  "Sant Kabir Nagar","Shahjahanpur","Shamli","Shravasti","Siddharthnagar",
  "Sitapur","Sonbhadra","Sultanpur","Unnao","Varanasi"
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050811);
scene.fog = new THREE.Fog(0x050811, 40, 120);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 34, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvasWrap').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;

scene.add(new THREE.AmbientLight(0x6688aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(20, 35, 15);
scene.add(sun);

function makeLabel(text, color = '#eaf6ff', scale = 1) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 56;
  ctx.font = 'bold 20px Segoe UI, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 28);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3.4 * scale, 0.75 * scale, 1);
  return sprite;
}

const COLS = 10;
const CELL = 2.4;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickable = [];
const toast = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

DISTRICTS.forEach((name, i) => {
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  const isHamirpur = name === "Hamirpur";

  const geo = new THREE.BoxGeometry(CELL * 0.8, isHamirpur ? 1.2 : 0.4, CELL * 0.8);
  const mat = new THREE.MeshStandardMaterial({
    color: isHamirpur ? 0x4fd8ff : 0x27384d,
    emissive: isHamirpur ? 0x0d4a5c : 0x000000,
    emissiveIntensity: isHamirpur ? 0.7 : 0,
    roughness: 0.6,
  });
  const block = new THREE.Mesh(geo, mat);
  block.position.set((col - COLS / 2) * CELL, isHamirpur ? 0.6 : 0.2, (row - 3.5) * CELL);
  block.userData = { name, active: isHamirpur };
  scene.add(block);
  clickable.push(block);

  const label = makeLabel(name, isHamirpur ? '#4fd8ff' : '#8fa3b8', isHamirpur ? 1.2 : 0.62);
  label.position.set(block.position.x, (isHamirpur ? 1.4 : 0.6), block.position.z);
  scene.add(label);
});

function onClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickable);
  if (hits.length > 0) {
    const data = hits[0].object.userData;
    if (data.active) {
      showToast(data.name + " flood simulation khol rahe hain...");
      setTimeout(() => { location.href = 'flood_demo.html'; }, 500);
    } else {
      showToast(data.name + " — Coming Soon (abhi sirf Hamirpur ka demo ready hai)");
    }
  }
}
renderer.domElement.addEventListener('click', onClick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
