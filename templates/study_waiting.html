<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoya Study - Ready</title>
<style>
  :root {
    --bg-dark: #050811;
    --cyan: #4fd8ff;
    --muted: #627b9b;
    --text: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%;
    background: var(--bg-dark);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--cyan);
    margin: 0 auto 20px;
    box-shadow: 0 0 16px var(--cyan);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  h1 { font-size: 20px; letter-spacing: 2px; color: var(--cyan); margin-bottom: 10px; }
  p { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>ZOYA STUDY - READY</h1>
    <p id="status">Topic ka wait kar rahe hain... is tab ko band mat karna.</p>
  </div>

<script>
// This tab sits here and asks the backend every second whether a new
// study topic has been requested. When one arrives, it navigates ITSELF
// (location.href) - a page navigating itself is never blocked by popup
// blockers, unlike window.open() called from outside without a click.
async function checkForPendingTopic() {
  try {
    const res = await fetch('/api/study_pending');
    const data = await res.json();
    if (data.topic) {
      document.getElementById('status').textContent = "Topic mil gaya: " + data.topic + " - le ja rahe hain...";
      location.href = '/study?topic=' + encodeURIComponent(data.topic);
      return; // stop polling, we're navigating away
    }
  } catch (e) {
    console.error("Pending-topic check failed:", e);
  }
  setTimeout(checkForPendingTopic, 1000);
}

checkForPendingTopic();
</script>
</body>
</html>
