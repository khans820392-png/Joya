<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoya - Uttar Pradesh Districts (3D, Real Shapes)</title>
<style>
  :root {
    --bg-dark: #050811;
    --panel-bg: rgba(10, 16, 30, 0.85);
    --border-glow: rgba(79, 216, 255, 0.3);
    --cyan: #4fd8ff;
    --amber: #ffcc66;
    --muted: #8fa3b8;
    --text: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
  #canvasWrap { position: absolute; inset: 0; }

  .top-title { position: absolute; top: 18px; left: 20px; z-index: 10; }
  .top-title h1 { font-size: 18px; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  .top-title p { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 460px; }

  .back-btn {
    position: absolute; top: 18px; right: 20px; z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--border-glow);
    color: var(--cyan); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; cursor: pointer; letter-spacing: 1px;
  }
  .back-btn:hover { background: rgba(79,216,255,0.15); }

  .hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-bg); border: 1px solid var(--border-glow);
    padding: 8px 18px; border-radius: 20px; font-size: 12px; color: var(--cyan);
    z-index: 10; backdrop-filter: blur(8px);
  }

  .toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(255,204,102,0.15); border: 1px solid var(--amber);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; color: var(--amber);
    z-index: 10; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }

  .loader {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 30;
    background: var(--bg-dark);
  }
  .loader .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  .loader p { font-size: 13px; color: var(--muted); }
  .loader.hidden { display: none; }
</style>
</head>
<body>

<div class="top-title">
  <h1>UTTAR PRADESH — DISTRICTS (REAL BOUNDARIES)</h1>
  <p>Asli district shapes, live data se load ho rahi hain. Abhi sirf Hamirpur active hai (flood simulation demo).</p>
</div>
<button class="back-btn" onclick="location.href='/india-map2'">← INDIA MAP</button>

<div id="canvasWrap"></div>
<div class="toast" id="toast"></div>
<div class="hint">Mouse se ghumao • Highlighted district (Hamirpur) par click karo</div>
<div class="loader" id="loader"><div class="dot"></div><p>Real district data load ho raha hai...</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =========================================================
// UP districts using REAL district boundary GeoJSON (fetched live).
// Source: udit-001/india-maps-data (per-state file, district-level).
// =========================================================

const GEOJSON_URL = "https://cdn.jsdelivr.net/gh/udit-001/india-maps-data@cc91a19/geojson/states/uttar-pradesh.geojson";
const TARGET_DISTRICT = "hamirpur";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050811);
scene.fog = new THREE.Fog(0x050811, 40, 120);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 32, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvasWrap').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;

scene.add(new THREE.AmbientLight(0x6688aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(20, 35, 15);
scene.add(sun);

function makeLabel(text, color = '#eaf6ff', scale = 1) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 56;
  ctx.font = 'bold 22px Segoe UI, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 28);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3.2 * scale, 0.72 * scale, 1);
  return sprite;
}

function getFeatureName(props) {
  const candidates = ['district', 'DISTRICT', 'NAME_2', 'dtname', 'DTNAME', 'name', 'NAME', 'District'];
  for (const key of candidates) {
    if (props && props[key]) return String(props[key]);
  }
  if (props) {
    for (const k in props) {
      if (typeof props[k] === 'string') return props[k];
    }
  }
  return 'Unknown';
}

function ringToShapePoints(ring, project) {
  return ring.map(([lon, lat]) => {
    const p = project(lon, lat);
    return new THREE.Vector2(p.x, p.y);
  });
}

function polygonToShapes(coords, project) {
  const shape = new THREE.Shape(ringToShapePoints(coords[0], project));
  for (let i = 1; i < coords.length; i++) {
    shape.holes.push(new THREE.Path(ringToShapePoints(coords[i], project)));
  }
  return [shape];
}

function geometryToShapes(geometry, project) {
  if (!geometry) return [];
  if (geometry.type === 'Polygon') {
    return polygonToShapes(geometry.coordinates, project);
  } else if (geometry.type === 'MultiPolygon') {
    let shapes = [];
    geometry.coordinates.forEach(poly => {
      shapes = shapes.concat(polygonToShapes(poly, project));
    });
    return shapes;
  }
  return [];
}

function computeBounds(features) {
  let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
  function scanCoords(coords, depth) {
    if (depth === 0) {
      const [lon, lat] = coords;
      if (lon < minLon) minLon = lon;
      if (lon > maxLon) maxLon = lon;
      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
    } else {
      coords.forEach(c => scanCoords(c, depth - 1));
    }
  }
  features.forEach(f => {
    if (!f.geometry) return;
    const depth = f.geometry.type === 'Polygon' ? 2 : 3;
    scanCoords(f.geometry.coordinates, depth);
  });
  return { minLon, maxLon, minLat, maxLat };
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickable = [];
const toast = document.getElementById('toast');
const loader = document.getElementById('loader');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

fetch(GEOJSON_URL)
  .then(r => r.json())
  .then(geo => {
    const features = geo.features || [];
    const bounds = computeBounds(features);
    const centerLon = (bounds.minLon + bounds.maxLon) / 2;
    const centerLat = (bounds.minLat + bounds.maxLat) / 2;
    const spanLon = Math.max(0.0001, bounds.maxLon - bounds.minLon);
    const spanLat = Math.max(0.0001, bounds.maxLat - bounds.minLat);
    const TARGET_WIDTH = 34;
    const scale = TARGET_WIDTH / Math.max(spanLon, spanLat);

    function project(lon, lat) {
      return {
        x: (lon - centerLon) * scale,
        y: -(lat - centerLat) * scale
      };
    }

    let targetLabeled = false;

    features.forEach(feature => {
      const name = getFeatureName(feature.properties);
      const isTarget = name.toLowerCase().includes(TARGET_DISTRICT);
      const shapes = geometryToShapes(feature.geometry, project);
      if (shapes.length === 0) return;

      shapes.forEach(shape => {
        const extrudeSettings = { depth: isTarget ? 1.0 : 0.3, bevelEnabled: false };
        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        const mat = new THREE.MeshStandardMaterial({
          color: isTarget ? 0x4fd8ff : 0x27384d,
          emissive: isTarget ? 0x0d4a5c : 0x000000,
          emissiveIntensity: isTarget ? 0.6 : 0,
          roughness: 0.6,
          side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.userData = { name, active: isTarget };
        scene.add(mesh);
        clickable.push(mesh);
      });

      if (isTarget && !targetLabeled) {
        const fb = computeBounds(features.filter(f => getFeatureName(f.properties).toLowerCase().includes(TARGET_DISTRICT)));
        const c = project((fb.minLon + fb.maxLon) / 2, (fb.minLat + fb.maxLat) / 2);
        const label = makeLabel(name, '#4fd8ff', 1.1);
        label.position.set(c.x, 1.4, c.y);
        scene.add(label);
        targetLabeled = true;
      }
    });

    loader.classList.add('hidden');
  })
  .catch(err => {
    console.error('Failed to load district data:', err);
    loader.querySelector('p').textContent = 'District data load nahi ho paya - internet connection check karo.';
  });

function onClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickable);
  if (hits.length > 0) {
    const data = hits[0].object.userData;
    if (data.active) {
      showToast(data.name + " flood simulation khol rahe hain...");
      setTimeout(() => { location.href = '/hamirppur_demo2'; }, 500);
    } else {
      showToast(data.name + " — Coming Soon (abhi sirf Hamirpur ka demo ready hai)");
    }
  }
}
renderer.domElement.addEventListener('click', onClick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
