<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoya - India Map (3D)</title>
<style>
  :root {
    --bg-dark: #050811;
    --panel-bg: rgba(10, 16, 30, 0.85);
    --border-glow: rgba(79, 216, 255, 0.3);
    --cyan: #4fd8ff;
    --amber: #ffcc66;
    --muted: #8fa3b8;
    --text: #eaf6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
  #canvasWrap { position: absolute; inset: 0; }

  .top-title { position: absolute; top: 18px; left: 20px; z-index: 10; }
  .top-title h1 { font-size: 18px; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  .top-title p { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 420px; }

  .hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-bg); border: 1px solid var(--border-glow);
    padding: 8px 18px; border-radius: 20px; font-size: 12px; color: var(--cyan);
    z-index: 10; backdrop-filter: blur(8px);
  }

  .toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(255,204,102,0.15); border: 1px solid var(--amber);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; color: var(--amber);
    z-index: 10; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-title">
  <h1>INDIA — 3D MAP (STYLIZED)</h1>
  <p>Ye exact geographic boundaries nahi hain, ek simplified block-representation hai. Abhi sirf Uttar Pradesh active hai.</p>
</div>

<div id="canvasWrap"></div>
<div class="toast" id="toast"></div>
<div class="hint">Mouse se ghumao • Highlighted block (Uttar Pradesh) par click karo</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// =========================================================
// Stylized India map - rough grid positions, NOT accurate
// geographic borders. For presentation/demo purposes.
// =========================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050811);
scene.fog = new THREE.Fog(0x050811, 40, 110);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(10, 30, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvasWrap').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x6688aa, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(20, 35, 15);
scene.add(sun);

// ---------- Text sprite helper (floating labels) ----------
function makeLabel(text, color = '#eaf6ff', scale = 1) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.font = 'bold 26px Segoe UI, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.2 * scale, 1.05 * scale, 1);
  return sprite;
}

// ---------- States + UTs with rough grid positions [col, row] ----------
// col: west(-) to east(+), row: north(-) to south(+). Purely illustrative.
const STATES = [
  // North
  { name: "Jammu & Kashmir", pos: [0, -9] },
  { name: "Ladakh", pos: [2.5, -9.5] },
  { name: "Himachal Pradesh", pos: [0.5, -7] },
  { name: "Punjab", pos: [-1.5, -6] },
  { name: "Chandigarh", pos: [-0.5, -6.6] },
  { name: "Uttarakhand", pos: [2, -6] },
  { name: "Haryana", pos: [-1, -4.8] },
  { name: "Delhi", pos: [-0.2, -4.4] },
  { name: "Uttar Pradesh", pos: [2, -4], featured: true },
  { name: "Rajasthan", pos: [-3.5, -3] },
  { name: "Sikkim", pos: [7.5, -5.5] },
  { name: "Arunachal Pradesh", pos: [10, -6] },
  // Central / East
  { name: "Bihar", pos: [5.5, -2.5] },
  { name: "West Bengal", pos: [7, -1] },
  { name: "Assam", pos: [9, -3] },
  { name: "Nagaland", pos: [10.5, -2.5] },
  { name: "Meghalaya", pos: [8.5, -1.5] },
  { name: "Manipur", pos: [10.5, -1] },
  { name: "Tripura", pos: [8, -0.2] },
  { name: "Mizoram", pos: [9.5, 0.3] },
  { name: "Madhya Pradesh", pos: [-0.5, -0.5] },
  { name: "Jharkhand", pos: [5.5, -0.3] },
  { name: "Chhattisgarh", pos: [1.5, 1] },
  { name: "Odisha", pos: [4, 1.8] },
  { name: "Gujarat", pos: [-4.5, 0.5] },
  { name: "Daman & Diu / DNH", pos: [-4, 1.8] },
  // South
  { name: "Maharashtra", pos: [-1.5, 2.8] },
  { name: "Telangana", pos: [1, 3.8] },
  { name: "Andhra Pradesh", pos: [2, 5.2] },
  { name: "Goa", pos: [-3, 4.5] },
  { name: "Karnataka", pos: [-1.3, 5.8] },
  { name: "Tamil Nadu", pos: [0.8, 7.8] },
  { name: "Kerala", pos: [-1.8, 7.8] },
  { name: "Puducherry", pos: [0.3, 7] },
  { name: "Andaman & Nicobar", pos: [6, 8] },
  { name: "Lakshadweep", pos: [-5, 6.5] },
];

const CELL = 1.9;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickable = [];
const toast = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

STATES.forEach(s => {
  const [col, row] = s.pos;
  const isUP = !!s.featured;

  const geo = new THREE.BoxGeometry(CELL * 0.82, isUP ? 1.1 : 0.5, CELL * 0.82);
  const mat = new THREE.MeshStandardMaterial({
    color: isUP ? 0x4fd8ff : 0x27384d,
    emissive: isUP ? 0x0d4a5c : 0x000000,
    emissiveIntensity: isUP ? 0.6 : 0,
    roughness: 0.6,
  });
  const block = new THREE.Mesh(geo, mat);
  block.position.set(col * CELL, isUP ? 0.55 : 0.25, row * CELL);
  block.userData = { name: s.name, active: isUP };
  scene.add(block);
  clickable.push(block);

  const label = makeLabel(s.name, isUP ? '#4fd8ff' : '#8fa3b8', isUP ? 1.15 : 0.62);
  label.position.set(col * CELL, (isUP ? 1.3 : 0.75), row * CELL);
  scene.add(label);
});

// ---------- Click handling ----------
function onClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickable);
  if (hits.length > 0) {
    const data = hits[0].object.userData;
    if (data.active) {
      showToast(data.name + " khola ja raha hai...");
      setTimeout(() => { location.href = '/up-districts'; }, 500);
    } else {
      showToast(data.name + " — Coming Soon (abhi educational demo sirf Uttar Pradesh ke liye hai)");
    }
  }
}
renderer.domElement.addEventListener('click', onClick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
